<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Dot Dodger · a one-file game</title>
<style>
  html, body { margin: 0; height: 100%; background: #101820; }
  canvas { display: block; margin: 0 auto; background: #1b2a38; }
  #score { position: fixed; top: 10px; left: 12px; color: #ffd166; font: 16px sans-serif; }
  .hint { position: fixed; bottom: 10px; left: 12px; color: #8ea; font: 12px sans-serif; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<div class="hint">Arrow keys to move</div>
<img id="logo" src="img/logo.png" hidden>
<canvas id="c" width="480" height="320"></canvas>
<script>
  const c = document.getElementById('c'), g = c.getContext('2d')
  const p = { x: 240, y: 160 }, keys = {}
  let score = 0
  addEventListener('keydown', (e) => (keys[e.key] = true))
  addEventListener('keyup', (e) => (keys[e.key] = false))
  function frame() {
    if (keys.ArrowLeft) p.x -= 3
    if (keys.ArrowRight) p.x += 3
    g.fillStyle = '#1b2a38'; g.fillRect(0, 0, 480, 320)
    g.fillStyle = '#66d4ff'; g.beginPath(); g.arc(p.x, p.y, 10, 0, 7); g.fill()
    document.getElementById('score').textContent = 'Score: ' + ++score
    window.__frames = (window.__frames || 0) + 1
    requestAnimationFrame(frame)
  }
  frame()
</script>
</body>
</html>
